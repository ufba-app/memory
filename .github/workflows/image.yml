# Compila o ai-memory oficial (akitaonrails/ai-memory) na versão do arquivo VERSION, com o console de gestão
# (--features management-ui), e publica em ghcr.io/ufba-app/ai-memory. O Railway só baixa essa imagem pronta.
# Não há cópia do código do ai-memory aqui: a receita aponta para a tag oficial.
name: image

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Código oficial do ai-memory
        uses: actions/checkout@v4
        with:
          repository: akitaonrails/ai-memory
          ref: ${{ steps.v.outputs.tag }}
          path: upstream

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64
          build-args: AI_MEMORY_FEATURES=management-ui
          push: true
          tags: |
            ghcr.io/ufba-app/ai-memory:${{ steps.v.outputs.version }}
            ghcr.io/ufba-app/ai-memory:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ufba-app/memory
            org.opencontainers.image.description=ai-memory ${{ steps.v.outputs.tag }} com management-ui
          cache-from: type=gha
          cache-to: type=gha,mode=max
